<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Code Judge</title>
        <link rel="stylesheet" href="style.css" />

        <!-- CodeMirror CSS & JS (or swap with Monaco) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
        <script type="module">
            import { 
                processLeaderboardSubmission, 
                fetchTaskLeaderboard 
            } from "./firebase-config.js";

            // Make them accessible globally for your UI button handlers
            window.processLeaderboardSubmission = processLeaderboardSubmission;
            window.fetchTaskLeaderboard = fetchTaskLeaderboard;
        </script>

        <!-- Pyodide -->
        <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    </head>
    <body>

        <div class="app-container">
            <!-- Sidebar / Navigation -->
            <aside class="sidebar">
                <!-- User nickname and history controls -->
                <div class="user-profile-section">
                    <label for="nicknameInput" class="input-label">ニックネーム (Nickname)</label>
                    <input type="text" id="nicknameInput" placeholder="例: Yamada123" maxLength="20" />
                    <button id="nicknameSetBtn" class="btn btn-secondary">設定</button>
                </div>
                <div class="history-action-section">
                    <button id="viewHistoryBtn" class="btn btn-secondary width-full">提出履歴を見る (View History)</button>
                </div>

                <!-- Tag filter and tasks list -->
                <h2>Tasks</h2>
                <select id="tagSelect">
                    <option value="">Select a tag...</option>
                </select>
                <select id="taskSelect">
                    <option value="">Select a task...</option>
                </select>

                <!-- Task description -->
                <div id="taskDescription" class="markdown-body">
                    <p>Select a task from the dropdown to get started.</p>
                </div>

                <!-- Leaderboard Section -->
                <div id="leaderboardContainer" class="leaderboard-card hidden">
                    <div class="leaderboard-header">
                        <h3>ランキング (Leaderboard)</h3>
                        <div class="tab-group">
                            <button id="btnTabTime" class="tab-btn active" onclick="switchLeaderboardTab('time')">⚡ 実行時間</button>
                            <button id="btnTabMemory" class="tab-btn" onclick="switchLeaderboardTab('memory')">💾 メモリ</button>
                        </div>
                    </div>
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>順位</th>
                                <th>ユーザー</th>
                                <th id="lbMetricCol">計算量 (時間)</th>
                                <th id="lbSecondaryCol">平均 (ms)</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <!-- Dynamically populated by app.js -->
                        </tbody>
                    </table>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="editor-section">
            <!-- Editor Toolbar -->
            <div class="editor-header">
                <div class="file-actions">
                    <button id="resetBtn" class="btn btn-secondary" title="Reset script">初期化</button>
                    <button id="saveBtn" class="btn btn-secondary" title="Download Python script">ファイル保存</button>
                    <button id="loadBtn" class="btn btn-secondary" title="Load Python script from disk">ファイル開く</button>
                    <!-- Hidden file input for uploading -->
                    <input type="file" id="fileInput" accept=".py,.txt" style="display: none;" />
                </div>

                <div class="execution-actions">
                    <button id="runBtn" class="btn btn-secondary" disabled>サンプル実行</button>
                    <button id="submitBtn" class="btn btn-primary" disabled>提出して採点</button>
                </div>
            </div>

            <!-- Tab strip container -->
             <div id="editorTabs" class="tab-strip">
                <!-- Dynamically populated by app.js -->
             </div>

            <!-- Code Editor Container -->
            <div id="editor-wrapper">
                <textarea id="codeEditor"></textarea>
            </div>

            <!-- Read-only view container for support filers (hidden by default) -->
            <div id="readonlyFileView" class="readonly-view hidden">
                <pre><code id="readonlyCodeContent"></code></pre>
            </div>

            <!-- Console / Results Output Panel -->
            <div class="output-panel">
                <div class="output-header">Console Output</div>
                <pre id="outputConsole">Initializing Python runtime...</pre>
            </div>
            </main>
        </div>

        <!-- Submission history modal -->
        <div id="historyModal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>提出履歴 (Submission History)</h3>
                    <button id="closeHistoryBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="historyListContainer">
                        <!-- Dynamically populated by app.js -->
                    </div>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
        <script type="module" src="firebase-config.js"></script>
    </body>
</html>
