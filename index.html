<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Python Visual Judge - Monaco Edition</title>
        
        <!-- 1. Load Pyodide CDN -->
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

        <!-- 2. Load Monaco Editor CDN Loader -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

        <style>
            body { font-family: sans-serif; margin: 2rem; background-color: #f4f4f9; }
            /* Monaco requires an explicit height on its container div! */
            #editor-container { width: 100%; height: 300px; border: 1px solid #ccc; border-radius: 4px; }
            button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; }
            #output { background: #222; color: #0f0; padding: 15px; font-family: monospace; margin-top: 15px; min-height: 80px; white-space: pre-wrap; }
            #status { color: #555; font-weight: bold; }
        </style>
    </head>
    <body>

        <h1>Visual Judge Prototype</h1>
        <p id="status">Status: Initializing Monaco & Pyodide...</p>

        <h3>Python Code Editor</h3>
        <!-- Monaco will render inside this container -->
        <div id="editor-container"></div>

        <br>
        <button id="run-btn" disabled>Run Code</button>

        <h3>Test Case Output</h3>
        <div id="output">Results will appear here...</div>

        <script src="app.js"></script>
    </body>
</html>
