<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Code Judge</title>
        <link rel="stylesheet" href="style.css" />

        <!-- CodeMirror CSS & JS (or swap with Monaco) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

        <!-- Pyodide -->
        <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    </head>
    <body>

        <div class="app-container">
            <!-- Sidebar / Navigation -->
            <aside class="sidebar">
            <h2>Tasks</h2>
            <select id="taskSelect">
                <option value="">Select a task...</option>
            </select>
            <div id="taskDescription" class="markdown-body">
                <p>Select a task from the dropdown to get started.</p>
            </div>
            </aside>

            <!-- Main Content Area -->
            <main class="editor-section">
            <!-- Editor Toolbar -->
            <div class="editor-header">
                <div class="file-actions">
                    <button id="resetBtn" class="btn btn-secondary" title="Reset script">初期化</button>
                    <button id="saveBtn" class="btn btn-secondary" title="Download Python script">ファイル保存</button>
                    <button id="loadBtn" class="btn btn-secondary" title="Load Python script from disk">ファイル開く</button>
                    <!-- Hidden file input for uploading -->
                    <input type="file" id="fileInput" accept=".py,.txt" style="display: none;" />
                </div>

                <div class="execution-actions">
                    <button id="runBtn" class="btn btn-secondary" disabled>サンプル実行</button>
                    <button id="submitBtn" class="btn btn-primary" disabled>提出して採点</button>
                </div>
            </div>

            <!-- Code Editor Container -->
            <div class="editor-wrapper">
                <textarea id="codeEditor"></textarea>
            </div>

            <!-- Console / Results Output Panel -->
            <div class="output-panel">
                <div class="output-header">Console Output</div>
                <pre id="outputConsole">Initializing Python runtime...</pre>
            </div>
            </main>
        </div>

        <script src="app.js"></script>
    </body>
</html>
